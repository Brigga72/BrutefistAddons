name: Addon regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lua-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lupa==2.8
      - run: python tests-death-review/run.py
